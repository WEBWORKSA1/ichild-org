name: Auto-refresh data (recalls, news, videos)

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

permissions:
  contents: write

concurrency:
  group: auto-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch fresh data
        run: python scripts/update_data.py
      - name: Update sitemap lastmod
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          sed -i -E "s#<lastmod>[0-9-]+</lastmod>#<lastmod>${TODAY}</lastmod>#g" sitemap.xml
      - name: Commit if changed
        run: |
          git config user.name "ichild-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data sitemap.xml
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: auto-refresh data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
